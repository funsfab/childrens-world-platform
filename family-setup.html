<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><title>Create Child Profile — Children World</title><link rel="stylesheet" href="css/style.css"></head><body class="access-page"><header class="sub-top shell"><a class="brand compact" href="index.html"><span class="brand-mark">🧒</span><span><strong>CHILD PROFILE</strong><small>MINIMAL DATA</small></span></a><a class="pill ghost" href="register.html">← Back</a></header><main class="access-shell"><section class="access-intro"><span class="eyebrow">STEP 2 OF 3 • FAMILY SETUP</span><h1>Create the explorer profile.</h1><p>Use a nickname, an age band and an avatar. The prototype deliberately does not ask for school, address, child phone or precise location.</p><div class="privacy-mini">🛡️ Privacy-first: only what the experience needs.</div></section><form class="access-form" id="childSetup"><label>Explorer nickname<input id="childNickname" maxlength="18" required placeholder="RocketFox"></label><label>Age band<select id="childAge"><option value="10-11">10–11</option><option value="11-12">11–12</option><option value="12-13">12–13</option></select></label><fieldset><legend>Choose an avatar</legend><div class="avatar-picker"><button type="button" class="avatar-choice selected" data-avatar="🦊">🦊</button><button type="button" class="avatar-choice" data-avatar="🐼">🐼</button><button type="button" class="avatar-choice" data-avatar="🚀">🚀</button><button type="button" class="avatar-choice" data-avatar="🐯">🐯</button><button type="button" class="avatar-choice" data-avatar="🦁">🦁</button><button type="button" class="avatar-choice" data-avatar="🧠">🧠</button></div></fieldset><button class="btn primary full" type="submit">Review trial access →</button></form></main><script src="js/access.js"></script><script src="js/state.js"></script><script>let avatar='🦊';document.querySelectorAll('.avatar-choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.avatar-choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');avatar=b.dataset.avatar});document.getElementById('childSetup').addEventListener('submit',e=>{e.preventDefault();const s=CWAccess.get();s.childNickname=document.getElementById('childNickname').value.trim();s.childAge=document.getElementById('childAge').value;s.childAvatar=avatar;localStorage.setItem('cw_access_v1',JSON.stringify(s));location.href='trial-start.html'});</script></body></html>
